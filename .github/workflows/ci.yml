name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minideck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minideck"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/minideck
      STORAGE_DRIVER: local
      STORAGE_DIR: .data/ci-assets
      PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234
      COLLAB_PORT: "1234"
      COLLAB_DEBOUNCE_MS: "100"
      DECK_CREATE_RATE_LIMIT: "1000"
      AUTH_FAILURE_RATE_LIMIT: "1000"
      PLAYWRIGHT_CHANNEL: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm ci:check
      - run: pnpm exec vitest run --config vitest.integration.config.mts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
