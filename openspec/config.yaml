schema: spec-driven

# Project context: constraints that guide all OpenSpec artifacts and workflows.
context: |
  Every change must include automated tests for new or changed behavior.
  Put test work in the same task group as the implementation it covers.
  Never mark a task complete until its verification command passes.

# Per-artifact rules.
rules:
  tasks:
    - Include test tasks in the same group as the implementation they cover.
    - Each task must name a concrete verification command, test, or observable result.
    - Include a final integration task for lint, typecheck, and the relevant test suites.

# Per-operation guidance returned by `openspec instructions apply|archive --json`.
operations:
  apply:
    guidance:
      - Work on a branch named opsx/<change-name>; never commit directly to main.
      - Run the relevant tests before committing and do not mark a task complete while its verification fails.
      - After tests pass, commit and push the branch, then open a pull request.
      - Merge the pull request once required checks pass; if review approval is required, wait for the user.
      - Report the PR URL and the verification commands in the final summary.
  archive:
    guidance:
      - Archive only after the change's pull request has been merged.
      - Update the default branch before moving the change directory.
